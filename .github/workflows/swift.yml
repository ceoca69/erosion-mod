name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x ipabuild.sh

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Find IPA
        run: find . -name "*.ipa" -type f

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "**/*.ipa"
